plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  
gems: ['jekyll/scholar'] 

title: "Prof Kelly Blincoe"
description: "Prof Kelly Blincoe studies how teams create and maintain software products. She is a Professor of Software Engineering at the University of Auckland in New Zealand."

defaults:
  - scope:
      path: ""
    values:
      image: /imgs/Kelly_Blincoe.jpg
      alt: Kelly Blincoe

scholar:
  style: _bibliography/acm-sigchi-proceedings.csl
  locale: en

  sort_by: ordering, author
  order: ascending

  group_by: year
  group_order: descending

  source: ./_bibliography
  bibliography: references.bib

  bibtex_filters: latex	
  bibliography_template: bib
  
  replace_strings: true
  join_strings:    true

  bibliography_list_tag: 'div'
  bibliography_item_tag: 'span'
  
  bibtex_skip_fields: ['pdf', 'code', 'video', 'slides', 'ordering']
  
  query: "@*"
