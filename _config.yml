plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  
gems: ['jekyll/scholar'] 

title: "Prof Kelly Blincoe"
url: "https://kblincoe.github.io"
description: "Kelly Blincoe is a Professor of Software Engineering at the University of Auckland, studying the human aspects of software engineering, from the impact of AI to inclusive teams."

defaults:
  - scope:
      path: ""
    values:
      image: /imgs/Kelly_Blincoe_full.jpg
      alt: Kelly Blincoe

scholar:
  style: _bibliography/acm-sigchi-proceedings.csl
  locale: en

  sort_by: ordering, author
  order: ascending

  group_by: year
  group_order: descending

  source: ./_bibliography
  bibliography: references.bib

  bibtex_filters: latex	
  bibliography_template: bib
  
  replace_strings: true
  join_strings:    true

  bibliography_list_tag: 'div'
  bibliography_item_tag: 'span'
  
  bibtex_skip_fields: ['pdf', 'code', 'video', 'slides', 'ordering']
  
  query: "@*"

social:
  name: Kelly Blincoe
  links:
    - https://scholar.google.com/citations?user=lqL9DsoAAAAJ&hl=en
    - https://orcid.org/0000-0003-4092-9706
    - https://www.linkedin.com/in/kelly-blincoe-8b08a455/
    - https://github.com/kblincoe

